<style>
    .category-group {
        margin-bottom: 40px;
        background: var(--bg-panel);
        border: 1px solid var(--border);
        border-radius: var(--r-card);
        padding: 24px;
    }
    .trend-pill {
        display: inline-block;
        padding: 4px 10px;
        background: rgba(0, 229, 255, 0.1);
        color: var(--accent);
        border: 1px solid rgba(0, 229, 255, 0.2);
        border-radius: var(--r-btn);
        font-size: 11px;
        font-family: var(--font-mono);
        margin-right: 8px;
        margin-bottom: 8px;
    }
    .opp-card {
        display: flex;
        gap: 16px;
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: var(--r-btn);
        padding: 16px;
        margin-top: 12px;
    }
    .opp-img {
        width: 80px; height: 80px;
        border-radius: var(--r-btn);
        object-fit: cover;
        border: 1px solid var(--border);
    }
    .margin-badge {
        background: rgba(0, 255, 136, 0.1);
        color: var(--green);
        padding: 2px 6px;
        border-radius: 4px;
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 700;
    }
</style>
