<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Midra Logo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #F8FAFC; /* Light background for contrast */
            font-family: 'Inter', sans-serif;
        }
        .logo-container {
            background: #FFFFFF;
            padding: 60px 80px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .logo-text {
            font-size: 64px;
            font-weight: 900;
            color: #09090B;
            letter-spacing: -1px;
        }
        .logo-text span {
            color: #00E5FF;
        }
    </style>
<link rel="icon" type="image/png" href="midra-icon.png?v=1">
<style>
    /* FIX TOP VERTICAL GAP (Universal) */
    .screen { padding-top: 8px !important; }
</style>
</head>
<body>

    <!-- THIS IS YOUR LOGO -->
    <div class="logo-container" id="logo-to-capture">
        <svg viewBox="0 0 32 32" width="96" height="96">
            <rect x="0.5" y="0.5" width="31" height="31" fill="#000" stroke="#2A2A2A" stroke-width="1"/>
            <polyline points="6.5,24 6.5,8 16,18 25.5,8 25.5,24" fill="none" stroke="#00E5FF" stroke-width="3.2" stroke-linejoin="miter" stroke-linecap="square"/>
            <rect x="22" y="5.5" width="5" height="5" fill="#00FF88"/>
        </svg>
        <div class="logo-text">MIDRA</div>
    </div>

</body>
</html>
