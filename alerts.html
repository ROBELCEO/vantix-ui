<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vantix — Alerts</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    .alert-card {
        background: var(--bg-surface); border: 1px solid var(--border);
        border-radius: var(--r-card); padding: 16px; position: relative;
        overflow: hidden; margin-bottom: 12px;
    }
    .alert-card::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; }
    .alert-card.price-drop::before { background: var(--red); }
    .alert-card.stock-out::before { background: var(--green); }
    .alert-card.ai-insight::before { background: var(--violet); }
    .alert-card.default::before { background: var(--border-strong); }
    .alert-time { font-size: 10px; font-family: var(--font-mono); color: var(--text-tertiary); margin-bottom: 8px; }
    .alert-title { font-size: 14px; font-weight: 700; margin-bottom: 8px; color: var(--text-primary); }
    .alert-body { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
</style>
</head>
<body>

<div id="master-nav-container"></div>

<div class="screen">
    <div style="max-width: 800px; margin: 0 auto;">
        <div class="screen-title">Alerts Feed</div>
        <div class="screen-sub">Automated competitor monitoring & AI insights</div>

        <div id="alerts-container">
            <div class="text-tertiary" style="text-align: center; padding: 40px;">
                <span style="display:inline-block; width:20px; height:20px; border:2px solid var(--accent); border-top-color:transparent; border-radius:50%; animation: spin 1s linear infinite;"></span>
                <div style="margin-top: 12px;">Loading alert history...</div>
            </div>
        </div>
    </div>
</div>

<style>
    @keyframes spin { 100% { transform: rotate(360deg); } }
</style>

<script src="js/app.js?v=2047"></script>
<script src="js/alerts.js?v=1100"></script>
</body>
</html>
