<style>
    /* Alert Card Specific Styles */
    .alert-card {
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: var(--r-card);
        padding: 16px;
        position: relative;
        overflow: hidden;
        margin-bottom: 12px;
    }
    
    .alert-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 3px;
        height: 100%;
    }
    
    .alert-card.price-drop::before { background: var(--red); }
    .alert-card.stock-out::before { background: var(--green); }
    .alert-card.ai-insight::before { background: var(--violet); }
    .alert-card.default::before { background: var(--border-strong); }

    .alert-time {
        font-size: 10px;
        font-family: var(--font-mono);
        color: var(--text-tertiary);
        margin-bottom: 8px;
    }
    
    .alert-title {
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 8px;
        color: var(--text-primary);
    }
    
    .alert-body {
        font-size: 13px;
        color: var(--text-secondary);
        line-height: 1.6;
    }
</style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script></head>

        <div class="text-tertiary" style="text-align: center; padding: 40px 0;">
            <span style="display:inline-block; width:16px; height:16px; border:2px solid var(--accent); border-top-color:transparent; border-radius:50%; animation: spin 1s linear infinite; margin-bottom:12px;"></span>
