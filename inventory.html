<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vantix — Inventory</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="master-nav-container"></div>

<div class="screen">
    <div style="max-width: 1100px; margin: 0 auto;">
        <div class="screen-title">Smart Warehouse</div>
        <div class="screen-sub">Track inventory velocity, restock alerts, and trapped cash.</div>

        <!-- KPIs -->
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px;">
            <div class="kpi-card" style="border-color: rgba(0,255,136,0.3);">
                <div class="kpi-label">Cash Tied Up in Stock</div>
                <div class="kpi-value text-green" id="kpi-cash">$0.00</div>
            </div>
            <div class="kpi-card" style="border-color: rgba(255,170,0,0.3);">
                <div class="kpi-label">Items to Restock (14 Days)</div>
                <div class="kpi-value text-amber" id="kpi-restock">0</div>
            </div>
            <div class="kpi-card" style="border-color: rgba(255,34,102,0.3);">
                <div class="kpi-label">Dead Stock Items (60 Days)</div>
                <div class="kpi-value text-red" id="kpi-dead">0</div>
            </div>
        </div>

        <!-- INVENTORY TABLE -->
        <div class="panel">
            <div class="panel-header">Inventory Velocity & Intelligence</div>
            <div id="inventory-list" style="display: flex; flex-direction: column; gap: 8px; margin-top: 16px;">
                <div class="text-tertiary" style="font-size: 12px; text-align: center; padding: 20px;">Analyzing sales velocity...</div>
            </div>
        </div>
    </div>
</div>

<script src="js/nav.js"></script>
<script src="js/app.js?v=2045"></script>
<script src="js/inventory.js?v=2032"></script>
</body>
</html>
