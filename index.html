<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vantix — Connect</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="drawer-overlay" id="drawer-overlay" onclick="toggleMenu()"></div>
<div class="drawer" id="mobile-drawer">
    <div class="drawer-header">
        <div class="brand"><div class="brand-text">VANTI<span>X</span></div></div>
        <button onclick="toggleMenu()" style="background:none; border:none; color:var(--text); font-size:20px; cursor:pointer;">✕</button>
    </div>
    <a href="index.html" class="drawer-tab active">Connect</a>
    <a href="store.html" class="drawer-tab">My Store</a>
    <a href="competitors.html" class="drawer-tab">Competitors</a>
    <a href="terminal.html" class="drawer-tab">Terminal</a>
    <a href="alerts.html" class="drawer-tab">Alerts</a>
    <a href="membership.html" class="drawer-tab">Membership</a>
</div>
<div class="header">
  <a href="index.html" class="brand">
    <div class="mark"><svg viewBox="0 0 32 32"><rect x="0.5" y="0.5" width="31" height="31" fill="#000" stroke="#262626" stroke-width="1"/><polyline points="6.5,8 14.5,24 24,8" fill="none" stroke="#00E5FF" stroke-width="3.2" stroke-linejoin="miter" stroke-linecap="square"/><rect x="22" y="5.5" width="5" height="5" fill="#00FF88"/></svg></div>
    <div class="brand-text">VANTI<span>X</span></div>
  </a>
  <div class="tabs">
    <a href="index.html" class="tab active">Connect</a>
    <a href="store.html" class="tab">My Store</a>
    <a href="competitors.html" class="tab">Competitors</a>
    <a href="terminal.html" class="tab">Terminal</a>
    <a href="alerts.html" class="tab">Alerts</a>
    <a href="membership.html" class="tab">Membership</a>
  </div>
  <button id="mobile-btn" onclick="toggleMenu()" style="display:none; font-size:24px; color:var(--text); background:none; border:none; cursor:pointer;">☰</button>
</div>
<div class="screen">
  <div id="connect-unconnected" style="display:none; text-align:center; padding:60px 20px;">
    <h1 style="font-size:32px; margin-bottom:10px;">Welcome to Vantix</h1>
    <p style="color:var(--muted); margin-bottom:30px;">Your real-time Shopify intelligence dashboard.</p>
    <a href="https://vantix-my5f.onrender.com/api/shopify/install?shop=trendywear-dev.myshopify.com" style="display:inline-block; background:#5E8E3E; color:#fff; padding:14px 28px; text-decoration:none; font-weight:800; font-size:14px;">Connect Shopify Store</a>
  </div>
  <div id="connect-connected" style="display:none; text-align:center; padding:60px 20px;">
      <div style="width:80px; height:80px; background:rgba(0,255,136,0.1); border:2px solid var(--green); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; font-size:40px; color:var(--green);">✓</div>
      <h1 style="font-size:24px; font-weight:900; margin-bottom:8px;">Store Connected</h1>
      <p style="color:var(--muted); font-size:14px; margin-bottom:4px;">Successfully linked to:</p>
      <p style="color:var(--accent); font-size:16px; font-family:'JetBrains Mono'; font-weight:800;" id="connected-domain">store.myshopify.com</p>
  </div>
</div>
<script src="js/app.js"></script>
<script>
if(window.innerWidth <= 800) document.getElementById('mobile-btn').style.display = 'block';
async function checkConnectionStatus() {
    try {
        const res = await fetch('https://vantix-my5f.onrender.com/api/shopify/status');
        const data = await res.json();
        if(data.connected) {
            document.getElementById('connect-unconnected').style.display = 'none';
            document.getElementById('connect-connected').style.display = 'block';
            document.getElementById('connected-domain').innerText = data.domain;
        } else {
            document.getElementById('connect-unconnected').style.display = 'block';
        }
    } catch(e) {
        document.getElementById('connect-unconnected').style.display = 'block';
    }
}
checkConnectionStatus();
</script>
</body>
</html>
