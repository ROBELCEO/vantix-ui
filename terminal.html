<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vantix — Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div id="master-nav-container"></div>

<div class="screen">
    <div style="max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 300px 1fr; gap: 24px;">
        
        <!-- LEFT SIDEBAR: WATCHLIST -->
        <div>
            <div class="screen-title" style="font-size: 20px; margin-bottom: 16px;">Watchlist</div>
            <div id="watchlist-container" style="display: flex; flex-direction: column; gap: 8px;">
                <div class="text-tertiary" style="font-size: 12px; text-align: center; padding: 20px;">Loading products...</div>
            </div>
        </div>

        <!-- RIGHT MAIN AREA -->
        <div>
            <!-- PRICE HISTORY CHART -->
            <div class="panel" style="margin-bottom: 24px;">
                <div class="panel-header" style="display: flex; justify-content: space-between;">
                    <!-- THE IMAGE TAG IS GUARANTEED TO BE HERE NOW -->
                    <div style="display: flex; align-items: center; gap: 12px;">
                        Price History — 
                        <img id="chart-product-img" src="" style="width: 28px; height: 28px; border-radius: 4px; object-fit: cover; border: 1px solid var(--border); display: none;"> 
                        <span id="chart-product-name" style="color: var(--accent);">SELECT A PRODUCT</span>
                    </div>
                    <div class="badge badge-violet">30 Days</div>
                </div>
                <div style="height: 250px;">
                    <canvas id="terminalChart"></canvas>
                </div>
            </div>

            <!-- TACTICAL GRID: SAFE FLOOR & SIMULATOR -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                
                <!-- PRICE WAR SAFE FLOOR -->
                <div class="panel" style="border-color: rgba(255, 170, 0, 0.4); background: linear-gradient(180deg, rgba(255,170,0,0.05), transparent);">
                    <div class="panel-header" style="color: var(--amber);">⚔️ Price War Safe Floor</div>
                    <div id="safe-floor-content">
                        <div class="text-tertiary" style="font-size: 12px; text-align: center; padding: 20px;">Select a product to analyze margins.</div>
                    </div>
                </div>

                <!-- PROFIT FORECAST SIMULATOR -->
                <div class="panel" style="border-color: rgba(0, 229, 255, 0.4); background: linear-gradient(180deg, rgba(0,229,255,0.05), transparent);">
                    <div class="panel-header" style="color: var(--accent);">🔮 Profit Forecast Simulator</div>
                    <div id="simulator-content">
                        <div class="text-tertiary" style="font-size: 12px; text-align: center; padding: 20px;">Select a product to simulate pricing.</div>
                    </div>
                </div>

            </div>

            <!-- AI MARGIN ADVISOR -->
            <div class="panel" style="margin-top: 24px; border-color: rgba(139, 127, 255, 0.4);">
                <div class="panel-header" style="color: var(--violet); display: flex; justify-content: space-between;">
                    <div>🧠 AI Margin Advisor</div>
                    <div class="badge badge-violet">Groq</div>
                </div>
                <div id="ai-advisor-content">
                    <div class="text-tertiary" style="font-size: 12px; text-align: center; padding: 20px;">Select a product to generate AI strategy.</div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="js/app.js?v=2047"></script>
<script src="js/terminal.js?v=2028"></script>
</body>
</html>
